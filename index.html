<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Doraemon AI Pro V2</title>

<style>
*{box-sizing:border-box}

:root{
    --bg-primary:#0d1117;
    --bg-secondary:#161b22;
    --bg-header:#11161d;
    --bg-message:#21262d;
    --bg-user:#075985;
    --border:#30363d;
    --text-primary:#e6edf3;
    --text-secondary:#8b949e;
    --accent:#00d6ff;
    --accent-hover:#00b8e0;
    --success:#3fb950;
    --warning:#d29922;
    --error:#f85149;
}

body.light{
    --bg-primary:#ffffff;
    --bg-secondary:#f6f8fa;
    --bg-header:#f0f2f4;
    --bg-message:#ffffff;
    --bg-user:#0066cc;
    --border:#d0d7de;
    --text-primary:#24292f;
    --text-secondary:#57606a;
    --accent:#0066cc;
    --accent-hover:#0052a3;
}

*{
    scrollbar-width:thin;
    scrollbar-color:var(--accent) var(--bg-secondary);
}

*::-webkit-scrollbar{
    width:8px;
}

*::-webkit-scrollbar-track{
    background:var(--bg-secondary);
}

*::-webkit-scrollbar-thumb{
    background:var(--accent);
    border-radius:4px;
}

body{
    margin:0;
    background:var(--bg-primary);
    color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    transition:all 0.3s ease;
}

.app{
    width:100%;
    max-width:900px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:var(--bg-secondary);
}

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 18px;
    border-bottom:1px solid var(--border);
    background:var(--bg-header);
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    font-size:38px;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-5px)}
}

.title{
    font-size:20px;
    font-weight:bold;
    background:linear-gradient(135deg,var(--accent),#7c3aed);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.status{
    margin-top:4px;
    color:var(--success);
    font-size:12px;
    display:flex;
    align-items:center;
    gap:5px;
}

.status::before{
    content:"";
    width:8px;
    height:8px;
    background:var(--success);
    border-radius:50%;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:0.5}
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-primary);
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:all 0.2s;
}

.icon-btn:hover{
    background:var(--bg-message);
    border-color:var(--accent);
    transform:translateY(-2px);
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.msg{
    max-width:85%;
    padding:13px 16px;
    border-radius:15px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
    animation:slideIn 0.3s ease;
    position:relative;
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.ai{
    background:var(--bg-message);
    border:1px solid var(--border);
    align-self:flex-start;
    border-bottom-left-radius:5px;
}

.user{
    align-self:flex-end;
    background:var(--bg-user);
    color:white;
    border-bottom-right-radius:5px;
}

.name{
    font-weight:bold;
    margin-bottom:5px;
    font-size:13px;
    opacity:0.9;
}

.time{
    font-size:11px;
    opacity:0.6;
    margin-top:5px;
}

.inputbox{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid var(--border);
    background:var(--bg-header);
}

#input{
    flex:1;
    min-width:0;
    padding:14px;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    background:var(--bg-message);
    color:var(--text-primary);
    font-size:16px;
    transition:all 0.2s;
}

#input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(0,214,255,0.1);
}

button{
    border:0;
    border-radius:12px;
    padding:0 20px;
    background:var(--accent);
    color:#001014;
    font-weight:bold;
    cursor:pointer;
    transition:all 0.2s;
}

button:hover{
    background:var(--accent-hover);
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(0,214,255,0.3);
}

button:active{
    transform:scale(0.97);
}

.typing{
    color:var(--text-secondary);
    font-style:italic;
    font-size:13px;
}

.code{
    background:var(--bg-primary);
    border:1px solid var(--border);
    padding:12px;
    border-radius:8px;
    overflow-x:auto;
    margin-top:8px;
    font-family:'Consolas','Monaco',monospace;
    font-size:13px;
    position:relative;
}

.code-lang{
    position:absolute;
    top:0;
    right:0;
    background:var(--accent);
    color:#000;
    padding:2px 8px;
    font-size:11px;
    font-weight:bold;
    border-radius:0 8px 0 8px;
}

.suggestions{
    position:absolute;
    bottom:100%;
    left:0;
    right:0;
    background:var(--bg-message);
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:8px;
    max-height:200px;
    overflow-y:auto;
    display:none;
}

.suggestion-item{
    padding:10px 14px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
    transition:background 0.2s;
}

.suggestion-item:hover{
    background:var(--bg-header);
}

.suggestion-item:last-child{
    border-bottom:none;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,0.7);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-content{
    background:var(--bg-secondary);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
    max-width:600px;
    width:100%;
    max-height:80vh;
    overflow-y:auto;
    animation:modalSlide 0.3s ease;
}

@keyframes modalSlide{
    from{
        opacity:0;
        transform:scale(0.9);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    padding-bottom:12px;
    border-bottom:1px solid var(--border);
}

.modal-title{
    font-size:20px;
    font-weight:bold;
}

.close-btn{
    background:transparent;
    border:none;
    color:var(--text-secondary);
    font-size:24px;
    cursor:pointer;
    padding:0;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.close-btn:hover{
    color:var(--text-primary);
    background:transparent;
    transform:none;
    box-shadow:none;
}

.knowledge-item{
    background:var(--bg-message);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
}

.knowledge-q{
    color:var(--accent);
    font-weight:bold;
    margin-bottom:6px;
}

.knowledge-a{
    color:var(--text-primary);
}

.delete-btn{
    background:var(--error);
    color:white;
    border:none;
    padding:4px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    margin-top:8px;
}

@media(max-width:600px){
    .msg{max-width:92%}
    .title{font-size:17px}
    button{padding:0 15px}
    .header-actions{display:none}
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="header-left">
        <div class="logo">🤖</div>
        <div>
            <div class="title" id="aiName">Doraemon AI Pro</div>
            <div class="status">Online • Sẵn sàng</div>
        </div>
    </div>
    <div class="header-actions">
        <button class="icon-btn" onclick="toggleTheme()" title="Đổi theme">🌓</button>
        <button class="icon-btn" onclick="showHistory()" title="Lịch sử">📜</button>
        <button class="icon-btn" onclick="showKnowledge()" title="Kiến thức">🧠</button>
        <button class="icon-btn" onclick="exportData()" title="Xuất dữ liệu">💾</button>
    </div>
</header>

<main id="chat"></main>

<div class="inputbox" style="position:relative">
    <div class="suggestions" id="suggestions"></div>
    <input id="input"
           placeholder="Nhập câu hỏi... (gõ /help để xem lệnh)"
           autocomplete="off">
    <button onclick="send()">Gửi </button>
</div>

</div>

<!-- Modal Lịch sử -->
<div class="modal" id="historyModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">📜 Lịch sử trò chuyện</div>
            <button class="close-btn" onclick="closeModal('historyModal')">&times;</button>
        </div>
        <div id="historyContent"></div>
    </div>
</div>

<!-- Modal Kiến thức -->
<div class="modal" id="knowledgeModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">🧠 Kiến thức đã học</div>
            <button class="close-btn" onclick="closeModal('knowledgeModal')">&times;</button>
        </div>
        <div id="knowledgeContent"></div>
    </div>
</div>

<script>

/* =========================================================
   DORAEMON AI PRO - WEB EDITION V2
   Cải tiến: Wikipedia, Calculator nâng cao, Theme, Export/Import
   ========================================================= */

const AI_NAME = "Doraemon AI Pro";
const VERSION = "2.0";

let memory = JSON.parse(localStorage.getItem("doraemon_memory") || "{}");
let history = JSON.parse(localStorage.getItem("doraemon_history") || "[]");
let knowledge = JSON.parse(localStorage.getItem("doraemon_knowledge") || "[]");

// Gợi ý lệnh
const COMMANDS = [
    "/help - Xem hướng dẫn",
    "/day câu hỏi => câu trả lời - Dạy AI",
    "/history - Xem lịch sử",
    "/clear - Xóa chat",
    "/memory - Xem bộ nhớ",
    "/name tên - Đổi tên AI",
    "/export - Xuất dữ liệu",
    "/wiki từ khóa - Tra Wikipedia",
    "/theme - Đổi giao diện"
];

/* =========================
   TIỆN ÍCH
   ========================= */

function save(){
    localStorage.setItem("doraemon_memory", JSON.stringify(memory));
    localStorage.setItem("doraemon_history", JSON.stringify(history.slice(-100)));
    localStorage.setItem("doraemon_knowledge", JSON.stringify(knowledge));
}

function escapeHTML(text){
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

function formatTime(){
    return new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
}

function formatCode(text){
    // Phát hiện và format code blocks
    return text.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
        const language = lang || "code";
        return `<div class="code"><span class="code-lang">${language}</span>${escapeHTML(code.trim())}</div>`;
    });
}

/* =========================
   HIỂN THỊ
   ========================= */

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const suggestions = document.getElementById("suggestions");

function addMessage(role, text, showTime = true){
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "ai");
    
    const name = role === "user" ? "Bạn" : (memory.aiName || AI_NAME);
    const timeHtml = showTime ? `<div class="time">${formatTime()}</div>` : "";
    
    div.innerHTML = `
        <div class="name">${name}</div>
        <div>${formatCode(escapeHTML(text))}</div>
        ${timeHtml}
    `;
    
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function showTyping(){
    const div = document.createElement("div");
    div.className = "msg ai typing";
    div.id = "typing-indicator";
    div.innerHTML = `${memory.aiName || AI_NAME} đang suy nghĩ<span class="dots">...</span>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    
    // Animation dots
    let dots = 0;
    window.typingInterval = setInterval(() => {
        dots = (dots + 1) % 4;
        const el = div.querySelector(".dots");
        if(el) el.textContent = ".".repeat(dots);
    }, 300);
}

function removeTyping(){
    const el = document.getElementById("typing-indicator");
    if(el) el.remove();
    clearInterval(window.typingInterval);
}

/* =========================
   TÌM KIẾM WIKIPEDIA
   ========================= */

async function searchWikipedia(query){
    try{
        const lang = query.toLowerCase().includes("tiếng anh") ? "en" : "vi";
        const cleanQuery = query.replace(/wikipedia|wiki|tra|tìm|hiểu/gi,"").trim();
        
        if(!cleanQuery) return null;
        
        // Tìm kiếm
        const searchUrl = `https://${lang}.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(cleanQuery)}&limit=1&namespace=0&format=json&origin=*`;
        const searchRes = await fetch(searchUrl);
        const searchData = await searchRes.json();
        
        if(!searchData[1] || searchData[1].length === 0){
            return null;
        }
        
        const title = searchData[1][0];
        
        // Lấy nội dung
        const contentUrl = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}?origin=*`;
        const contentRes = await fetch(contentUrl);
        const contentData = await contentRes.json();
        
        if(contentData.type === "disambiguation"){
            return `📚 "${title}" có nhiều nghĩa. Hãy hỏi cụ thể hơn.`;
        }
        
        let extract = contentData.extract || "";
        if(extract.length > 500){
            extract = extract.substring(0, 500) + "...";
        }
        
        const url = contentData.content_urls?.desktop?.page || "";
        
        return `📚 **${title}**\n\n${extract}\n\n Nguồn: ${url}`;
        
    }catch(err){
        console.error("Wiki error:", err);
        return null;
    }
}

/* =========================
   MÁY TÍNH NÂNG CAO
   ========================= */

function calculator(text){
    let s = text.toLowerCase()
        .replace(/tính|bang|kết quả|bằng mấy|bằng bao nhiêu/g,"")
        .replace(/\?/g,"")
        .replace(/,/g,".")
        .trim();
    
    if(!/[0-9]/.test(s)) return null;
    
    // Hỗ trợ hàm toán học
    const mathFuncs = {
        'sqrt': 'Math.sqrt',
        'sin': 'Math.sin',
        'cos': 'Math.cos',
        'tan': 'Math.tan',
        'log': 'Math.log10',
        'ln': 'Math.log',
        'abs': 'Math.abs',
        'pi': 'Math.PI',
        'e': 'Math.E',
        '^': '**'
    };
    
    for(const [key, val] of Object.entries(mathFuncs)){
        s = s.split(key).join(val);
    }
    
    if(!/^[0-9+\-*/%.()\sMath.PIElogsqrtcossintanabs^]+$/.test(s)){
        return null;
    }
    
    try{
        const result = Function('"use strict";return (' + s + ')')();
        
        if(!Number.isFinite(result)) return null;
        
        const formatted = Number.isInteger(result) ? result : 
                         result < 0.0001 || result > 1000000 ? 
                         result.toExponential(4) : 
                         parseFloat(result.toFixed(6));
        
        return `🧮 Kết quả: ${formatted}`;
        
    }catch(e){
        return null;
    }
}

/* =========================
   TÌM KIẾM THÔNG MINH
   ========================= */

function similarity(a, b){
    const A = new Set(normalize(a).split(/\s+/).filter(w => w.length > 2));
    const B = new Set(normalize(b).split(/\s+/).filter(w => w.length > 2));
    
    if(A.size === 0 || B.size === 0) return 0;
    
    let same = 0;
    A.forEach(x => { if(B.has(x)) same++; });
    
    return same / Math.max(A.size, B.size);
}

function normalize(text){
    return text.toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/đ/g,"d");
}

function findBestMatch(question){
    let best = null;
    let bestScore = 0;
    
    for(const item of knowledge){
        const score = similarity(question, item.q);
        if(score > bestScore){
            bestScore = score;
            best = item;
        }
    }
    
    return bestScore >= 0.35 ? best : null;
}

/* =========================
   AI BRAIN
   ========================= */

function think(text){
    const q = normalize(text);
    
    // === CÁC LỆNH ===
    
    if(q === "/help" || q === "help"){
        return ` **HƯỚNG DẪN SỬ DỤNG**

**Lệnh cơ bản:**
${COMMANDS.join('\n')}

**Ví dụ:**
• /day Thủ đô Việt Nam là gì? => Hà Nội
• /wiki Python (lập trình)
• 2+2*3
• sin(30)

**Tính năng:**
✓ Tính toán cơ bản & nâng cao
✓ Tra cứu Wikipedia
✓ Học kiến thức mới
✓ Lưu trữ cục bộ
✓ Export/Import dữ liệu`;
    }
    
    if(q === "/clear"){
        if(confirm("Bạn có chắc muốn xóa toàn bộ lịch sử?")){
            history = [];
            save();
            chat.innerHTML = "";
            return "🧹 Đã xóa lịch sử!";
        }
        return "Đã hủy.";
    }
    
    if(q === "/memory"){
        return "🧠 **Bộ nhớ:**\n\n" + JSON.stringify(memory, null, 2);
    }
    
    if(q.startsWith("/name ")){
        const name = text.substring(6).trim();
        if(name){
            memory.aiName = name;
            save();
            document.getElementById("aiName").textContent = name;
            return `🤖 Đã đổi tên thành: **${name}**`;
        }
    }
    
    if(q.startsWith("/wiki ")){
        return null; // Xử lý async riêng
    }
    
    if(q === "/export"){
        return exportData();
    }
    
    if(q === "/theme"){
        toggleTheme();
        return "Đã đổi theme!";
    }
    
    // === TÍNH TOÁN ===
    const calc = calculator(text);
    if(calc) return calc;
    
    // === WIKIPEDIA (tự động) ===
    if(q.includes("là gì") || q.includes("là ai") || q.includes("định nghĩa") || q.includes("giới thiệu")){
        return null; // Sẽ xử lý async
    }
    
    // === KIẾN THỨC ĐÃ HỌC ===
    const match = findBestMatch(text);
    if(match){
        return match.a;
    }
    
    // === CHÀO HỎI ===
    if(/chào|hello|hi|hey|xin chào/.test(q)){
        const responses = [
            `Chào ${memory.userName || 'bạn'}! 👋 Mình có thể giúp gì?`,
            "Xin chào! Rất vui được gặp bạn! 😊",
            "Chào bạn! Hôm nay mình có thể giúp gì?"
        ];
        return responses[Math.floor(Math.random() * responses.length)];
    }
    
    // === CẢM ƠN ===
    if(/cảm ơn|cam on|thanks|thank you/.test(q)){
        return ["Không có gì! 😊", "Rất vui được giúp bạn!", "Lúc nào cần thì gọi mình nhé!"][Math.floor(Math.random() * 3)];
    }
    
    // === AI LÀ AI ===
    if(q.includes("ban la ai") || q.includes("ten ban")){
        return `Mình là **${memory.aiName || AI_NAME}** v${VERSION} - AI chatbot chạy trên trình duyệt của bạn!`;
    }
    
    // === LÀM ĐƯỢC GÌ ===
    if(q.includes("lam duoc gi") || q.includes("co the gi")){
        return `Mình có thể:
        
✅ Tính toán (cộng trừ nhân chia, hàm sin/cos/log...)
✅ Tra cứu Wikipedia
✅ Học kiến thức mới (/day)
✅ Lưu trữ cục bộ
✅ Xuất/nhập dữ liệu
✅ Chat cơ bản

Gõ /help để xem chi tiết!`;
    }
    
    // === KHÔNG BIẾT ===
    return `🤔 Mình chưa hiểu rõ câu này. Bạn có thể:

1. **Dạy mình:** /day câu hỏi => câu trả lời
2. **Tra Wikipedia:** /wiki từ khóa
3. **Xem lệnh:** /help

Hoặc hỏi lại theo cách khác nhé!`;
}

async function thinkAsync(text){
    // Xử lý Wikipedia async
    if(text.toLowerCase().startsWith("/wiki ")){
        const query = text.substring(6).trim();
        showTyping();
        const result = await searchWikipedia(query);
        removeTyping();
        return result || "❌ Không tìm thấy trên Wikipedia.";
    }
    
    // Tự động Wikipedia cho câu hỏi "là gì"
    if((text.toLowerCase().includes("là gì") || text.toLowerCase().includes("là ai")) && !text.startsWith("/")){
        showTyping();
        const query = text.replace(/là gì|là ai|\?/gi,"").trim();
        const result = await searchWikipedia(query);
        removeTyping();
        if(result) return result;
    }
    
    return think(text);
}

/* =========================
   COMMAND /DAY
   ========================= */

function command(text){
    if(!text.startsWith("/day ")) return null;
    
    const body = text.substring(5);
    const parts = body.split("=>");
    
    if(parts.length < 2){
        return "❌ **Sai cú pháp!**\n\nDùng: /day câu hỏi => câu trả lời\n\nVí dụ:\n/day Thủ đô Việt Nam => Hà Nội";
    }
    
    const q = parts[0].trim();
    const a = parts.slice(1).join("=>").trim();
    
    if(!q || !a){
        return "❌ Câu hỏi hoặc câu trả lời trống!";
    }
    
    // Kiểm tra trùng
    const existing = knowledge.find(k => normalize(k.q) === normalize(q));
    if(existing){
        if(confirm("Kiến thức này đã tồn tại. Bạn có muốn cập nhật?")){
            existing.a = a;
            existing.time = new Date().toISOString();
            save();
            return "✅ Đã **cập nhật** kiến thức!";
        }
        return "Đã hủy.";
    }
    
    knowledge.push({
        q: q,
        a: a,
        time: new Date().toISOString(),
        count: 0
    });
    
    save();
    return `✅ Đã học!\n\n**Q:** ${q}\n**A:** ${a}`;
}

/* =========================
   GỬI TIN NHẮN
   ========================= */

async function send(){
    const text = input.value.trim();
    if(!text) return;
    
    input.value = "";
    addMessage("user", text);
    
    history.push({role:"user", text:text, time:new Date().toISOString()});
    
    // Xử lý /day
    if(text.startsWith("/day ")){
        const response = command(text);
        addMessage("ai", response);
        history.push({role:"ai", text:response, time:new Date().toISOString()});
        save();
        return;
    }
    
    // AI suy nghĩ
    showTyping();
    
    setTimeout(async () => {
        const response = await thinkAsync(text);
        removeTyping();
        
        addMessage("ai", response);
        history.push({role:"ai", text:response, time:new Date().toISOString()});
        save();
    }, 300);
}

/* =========================
   GỢI Ý
   ========================= */

input.addEventListener("input", function(){
    const val = this.value.toLowerCase();
    
    if(val.startsWith("/")){
        const matches = COMMANDS.filter(c => c.toLowerCase().includes(val));
        
        if(matches.length > 0){
            suggestions.innerHTML = matches.map(c => 
                `<div class="suggestion-item" onclick="selectSuggestion('${c}')">${c}</div>`
            ).join("");
            suggestions.style.display = "block";
        }else{
            suggestions.style.display = "none";
        }
    }else{
        suggestions.style.display = "none";
    }
});

function selectSuggestion(text){
    input.value = text.split(" - ")[0];
    suggestions.style.display = "none";
    input.focus();
}

input.addEventListener("keydown", function(e){
    if(e.key === "Enter") send();
    if(e.key === "Escape") suggestions.style.display = "none";
});

/* =========================
   MODAL & CHỨC NĂNG
   ========================= */

function closeModal(id){
    document.getElementById(id).classList.remove("show");
}

function showHistory(){
    const content = document.getElementById("historyContent");
    if(history.length === 0){
        content.innerHTML = "<p style='color:var(--text-secondary);text-align:center'>Chưa có lịch sử</p>";
    }else{
        content.innerHTML = history.map(h => `
            <div class="knowledge-item">
                <div style="color:var(--text-secondary);font-size:12px">${h.time}</div>
                <div style="color:${h.role==='user'?'var(--accent)':'var(--text-primary)'}">
                    ${h.role === "user" ? "👤 Bạn" : "🤖 AI"}: ${h.text}
                </div>
            </div>
        `).reverse().join("");
    }
    document.getElementById("historyModal").classList.add("show");
}

function showKnowledge(){
    const content = document.getElementById("knowledgeContent");
    if(knowledge.length === 0){
        content.innerHTML = `
            <p style='color:var(--text-secondary);text-align:center'>Chưa có kiến thức</p>
            <p style='text-align:center;margin-top:10px'>Dùng lệnh <code>/day câu hỏi => câu trả lời</code> để dạy AI</p>
        `;
    }else{
        content.innerHTML = knowledge.map((k, i) => `
            <div class="knowledge-item">
                <div class="knowledge-q">Q: ${k.q}</div>
                <div class="knowledge-a">A: ${k.a}</div>
                <button class="delete-btn" onclick="deleteKnowledge(${i})">🗑 Xóa</button>
            </div>
        `).join("");
    }
    document.getElementById("knowledgeModal").classList.add("show");
}

function deleteKnowledge(index){
    if(confirm("Xóa kiến thức này?")){
        knowledge.splice(index, 1);
        save();
        showKnowledge();
    }
}

function toggleTheme(){
    document.body.classList.toggle("light");
    memory.theme = document.body.classList.contains("light") ? "light" : "dark";
    save();
}

function exportData(){
    const data = {
        memory,
        knowledge,
        history,
        exportedAt: new Date().toISOString(),
        version: VERSION
    };
    
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `doraemon-ai-backup-${new Date().toISOString().split("T")[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    
    return "💾 Đã tải xuống file backup!";
}

function importData(file){
    const reader = new FileReader();
    reader.onload = function(e){
        try{
            const data = JSON.parse(e.target.result);
            if(data.memory) memory = data.memory;
            if(data.knowledge) knowledge = data.knowledge;
            if(data.history) history = data.history;
            save();
            location.reload();
        }catch(err){
            alert("File không hợp lệ!");
        }
    };
    reader.readAsText(file);
}

/* =========================
   KHỞI ĐỘNG
   ========================= */

function loadHistory(){
    if(history.length === 0){
        addMessage("ai", `Xin chào! 👋\n\nMình là **${memory.aiName || AI_NAME}** v${VERSION}.\n\nMình có thể:\n• Tính toán\n• Tra Wikipedia\n• Học kiến thức mới\n\nGõ **/help** để xem hướng dẫn!`, false);
    }else{
        history.slice(-50).forEach(h => {
            addMessage(h.role, h.text, false);
        });
    }
}

// Áp dụng theme đã lưu
if(memory.theme === "light"){
    document.body.classList.add("light");
}
// Load
loadHistory();
input.focus();

</script>
